{% extends "base.html" %}
{% block page_title %}Launch a pipeline{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-6">
    <div class="ff-page-header">
      <h1>Launch a pipeline — FASTQ #{{ fastq.pk }}</h1>
    </div>
    <div class="card">
      <div class="card-body p-4">
        {% if templates %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="template" class="form-label">Pipeline template</label>
            <select name="template" id="template" class="form-select" required>
              <option value="" selected disabled>— Choose —</option>
              {% for t in templates %}
              <option value="{{ t.pk }}">{{ t.name }} ({{ t.steps.count }} step{{ t.steps.count|pluralize }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Launch</button>
            <a href="{% url 'ngs:fastq-detail' fastq.pk %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
        {% else %}
        <p class="ff-empty mb-0">
          No pipeline templates available. Create one from
          <a href="/admin/api/pipelinetemplate/add/">the admin</a>.
        </p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
