{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block page_title %}Log in{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <h1 class="mb-0">FastFlow</h1>
      <p class="ff-breadcrumb mb-0">NGS pipeline tracking</p>
    </div>
    <div class="card">
      <div class="card-header">Log in</div>
      <div class="card-body p-4">
        {% if form.errors %}
        <div class="alert alert-danger">Incorrect username or password.</div>
        {% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100 mt-2">Log in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
