server {
    listen 80;
    server_name _;

    # Résolution DNS dynamique de "web" via le DNS embarqué de Docker, plutôt
    # qu'un upstream statique (résolu une seule fois au démarrage des workers
    # nginx et gardé en cache pour leur durée de vie) : sans ça, recréer le
    # conteneur "web" (nouvelle IP sur le réseau Docker) laisse nginx pointer
    # vers l'ancienne IP jusqu'à un redémarrage manuel de nginx (502).
    resolver 127.0.0.11 valid=10s;
    set $django_upstream web:8000;

    # Les FASTQ volumineux (jusqu'à ~200 Go) sont envoyés par morceaux
    # (voir UPLOAD_CHUNK_SIZE dans settings.py, 64 Mo par défaut) : aucune
    # requête HTTP ne transporte jamais le fichier entier, donc pas besoin
    # d'une limite à l'échelle du fichier complet — une marge au-dessus de
    # la taille d'un morceau suffit.
    client_max_body_size 200m;

    client_body_timeout       120s;
    proxy_connect_timeout     60s;
    proxy_send_timeout        120s;
    proxy_read_timeout        120s;
    send_timeout              120s;

    # ── Fichiers statiques ────────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Fichiers media ────────────────────────────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Application Django ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://$django_upstream;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
